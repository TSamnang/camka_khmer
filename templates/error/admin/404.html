<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>404 · Page Not Found · FarmMarket Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <link rel="stylesheet" href="/static/style/error.css">
</head>
<body>
  <div class="login-wrap">
    <div class="error-card">
      <div class="error-icon-badge"><i class="bi bi-signpost-split"></i></div>

      <div class="error-code">404</div>
      <div class="error-title">Page not found</div>
      <p class="error-text">
        The admin page you're looking for doesn't exist, may have been moved, or the
        link you followed is broken.
      </p>

      <div class="error-links">
        <a href="{{ url_for('admin_bp.dashboard_page') }}"><i class="bi bi-house-door"></i> Back to dashboard</a>
        <span class="error-links-sep">·</span>
        <a href="{{ url_for('admin_bp.admin_login') }}"><i class="bi bi-arrow-left"></i> Back to login</a>
      </div>

      <div class="error-meta">
        <div class="d-flex justify-content-between">
          <span>Status</span><span class="fw-semibold">404 Not Found</span>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
