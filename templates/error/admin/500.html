<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>500 · Internal Server Error · FarmMarket Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <link rel="stylesheet" href="/static/style/error.css">
</head>
<body>
  <div class="login-wrap">
    <div class="error-card">
      <div class="error-icon-badge"><i class="bi bi-exclamation-triangle"></i></div>

      <div class="error-code">500</div>
      <div class="error-title">Internal server error</div>
      <p class="error-text">
        Something went wrong on our end while processing your request. Our
        team has been notified — please try again in a few minutes.
      </p>

      <div class="error-actions">
        <a href="{{ url_for('admin_bp.admin_login') }}" class="error-btn-primary">
          <i class="bi bi-arrow-clockwise"></i>Try again
        </a>
        <a href="{{ url_for('admin_bp.admin_login') }}" class="error-link-secondary">
          <i class="bi bi-arrow-left"></i>Back to sign in
        </a>
      </div>

      <div class="error-meta">
        <div class="d-flex justify-content-between">
          <span>Status</span><span class="fw-semibold">500 Internal Server Error</span>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
