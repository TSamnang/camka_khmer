<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>500 · Server Error — ចម្ការខ្មែរ</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link href="/static/style/homepage.css" rel="stylesheet" />
  <style>
    .error-hero {
      min-height: 60vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 4rem 1rem;
      background: radial-gradient(circle at 50% 20%, rgba(39, 78, 48, 0.06), transparent 70%);
    }
    .error-box {
      max-width: 580px;
      text-align: center;
      background: #ffffff;
      border-radius: 20px;
      border: 1px solid #ede8dc;
      padding: 3.5rem 2.5rem;
      box-shadow: 0 20px 45px rgba(22, 38, 26, 0.08);
    }
    .error-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #fdf0f0;
      color: #b33939;
      font-size: 0.85rem;
      font-weight: 600;
      padding: 6px 14px;
      border-radius: 50px;
      margin-bottom: 1.25rem;
    }
    .error-number {
      font-family: 'Playfair Display', serif;
      font-size: 5.5rem;
      font-weight: 700;
      line-height: 1;
      color: #1e3323;
      margin-bottom: 0.75rem;
    }
    .error-number span {
      color: #b33939;
    }
    .error-box h1 {
      font-family: 'Playfair Display', serif;
      font-size: 1.85rem;
      color: #16261a;
      margin-bottom: 1rem;
    }
    .error-box p {
      color: #5c6356;
      font-size: 1rem;
      line-height: 1.6;
      margin-bottom: 2rem;
    }
    .btn-front-green {
      background: #274e30;
      color: #ffffff;
      padding: 0.75rem 1.6rem;
      border-radius: 50px;
      font-weight: 600;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s ease;
    }
    .btn-front-green:hover {
      background: #1b3621;
      color: #ffffff;
      transform: translateY(-2px);
    }
    .btn-front-outline {
      border: 1.5px solid #274e30;
      color: #274e30;
      padding: 0.75rem 1.6rem;
      border-radius: 50px;
      font-weight: 600;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s ease;
    }
    .btn-front-outline:hover {
      background: #274e30;
      color: #ffffff;
      transform: translateY(-2px);
    }
  </style>
</head>
<body>

  <!-- NAVBAR -->
  {% include '/front/share/navbar.html' %}

  <!-- ERROR SECTION -->
  <section class="error-hero">
    <div class="error-box">
      <div class="error-pill">
        <i class="bi bi-exclamation-triangle"></i> Something Went Wrong
      </div>
      <div class="error-number">5<span>0</span>0</div>
      <h1>Internal Server Error</h1>
      <p>
        We encountered an unexpected issue while loading this page. Our farm support team has been notified. Please try again shortly.
      </p>
      <div class="d-flex flex-wrap justify-content-center gap-3">
        <a href="{{ url_for('front_bp.homepage') }}" class="btn-front-green">
          <i class="bi bi-house"></i> Back to Homepage
        </a>
        <a href="{{ url_for('front_bp.contact') }}" class="btn-front-outline">
          <i class="bi bi-envelope"></i> Contact Us
        </a>
      </div>
    </div>
  </section>

  <!-- FOOTER -->
  {% include '/front/share/footer.html' %}

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
