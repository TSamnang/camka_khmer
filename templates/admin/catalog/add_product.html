{% extends 'admin/master.html' %}

{% block content %}
<main class="content-area">
  <div class="row g-3">
    <div class="col-lg-8">
      <div class="panel">
        <div class="panel-header d-flex justify-content-between align-items-center">
          <h2>Product Details</h2>
          <a href="{{ url_for('admin_bp.product_page') }}" class="btn btn-outline-secondary btn-sm">
            <i class="bi bi-arrow-left me-1"></i>Back to Products
          </a>
        </div>
        <div class="panel-body p-4">
          <form method="post" action="{{ url_for('admin_bp.do_add_product') }}" enctype="multipart/form-data">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <div class="mb-3">
              <label class="form-label fw-semibold">Product Name <span class="text-danger">*</span></label>
              <input type="text" id="prodNameInput" name="name" class="form-control" placeholder="e.g. Bread, Jasmine Rice, Fresh Carrot" required autofocus>
            </div>

            <div class="mb-3">
              <label class="form-label fw-semibold">Description</label>
              <textarea id="prodDescInput" name="description" class="form-control" rows="3" placeholder="Freshly baked bread with a soft interior and golden crust..."></textarea>
            </div>

            <div class="row">
              <div class="col-md-6 mb-3">
                <label class="form-label fw-semibold">Category <span class="text-danger">*</span></label>
                <select id="prodCatInput" name="category" class="form-select" required>
                  <option value="" disabled selected>Choose category</option>
                  {% for cat in categories %}
                    <option value="{{ cat.name }}">{{ cat.name }}</option>
                  {% endfor %}
                </select>
              </div>
              <div class="col-md-6 mb-3">
                <label class="form-label fw-semibold">Farm / Farmer</label>
                <select id="prodFarmInput" name="farm" class="form-select">
                  <option value="" selected>Choose or leave default</option>
                  {% for farmer in farmers %}
                    <option value="{{ farmer.farm_name or farmer.farmer_name }}">{{ farmer.farmer_name }} — {{ farmer.farm_name }}</option>
                  {% endfor %}
                </select>
              </div>
            </div>

            <div class="row">
              <div class="col-md-6 mb-3">
                <label class="form-label fw-semibold">Origin / Province</label>
                <input type="text" id="prodOriginInput" name="origin" class="form-control" placeholder="e.g. Phnom Penh, Battambang">
              </div>
              <div class="col-md-6 mb-3">
                <label class="form-label fw-semibold">Badge / Label</label>
                <select name="badge" class="form-select">
                  <option value="Fresh" selected>Fresh</option>
                  <option value="Organic">Organic</option>
                  <option value="Popular">Popular</option>
                  <option value="Healthy">Healthy</option>
                  <option value="Premium">Premium</option>
                  <option value="Sweet">Sweet</option>
                </select>
              </div>
            </div>

            <div class="row">
              <div class="col-md-4 mb-3">
                <label class="form-label fw-semibold">Price (USD) <span class="text-danger">*</span></label>
                <div class="input-group">
                  <span class="input-group-text">$</span>
                  <input type="number" id="prodPriceInput" step="0.01" min="0" name="price" class="form-control" placeholder="0.00" required>
                </div>
              </div>
              <div class="col-md-4 mb-3">
                <label class="form-label fw-semibold">Unit <span class="text-danger">*</span></label>
                <input type="text" id="prodUnitInput" name="unit" class="form-control" placeholder="e.g. 1 loaf, 5kg bag, 1kg" required>
              </div>
              <div class="col-md-4 mb-3">
                <label class="form-label fw-semibold">Stock Quantity</label>
                <input type="number" min="0" name="stock" class="form-control" value="50" required>
              </div>
            </div>

            <div class="row">
              <div class="col-md-6 mb-3">
                <label class="form-label fw-semibold">Rating</label>
                <select name="rating" class="form-select">
                  <option value="★★★★★" selected>★★★★★ (5 stars)</option>
                  <option value="★★★★☆">★★★★☆ (4 stars)</option>
                  <option value="★★★☆☆">★★★☆☆ (3 stars)</option>
                </select>
              </div>
              <div class="col-md-6 mb-3">
                <label class="form-label fw-semibold">Status</label>
                <select id="prodStatusInput" name="status" class="form-select">
                  <option value="Approved" selected>Approved</option>
                  <option value="Pending">Pending</option>
                  <option value="Rejected">Rejected</option>
                </select>
              </div>
            </div>

            <div class="mb-4">
              <label class="form-label fw-semibold">Product Photo</label>
              <input type="file" id="prodPhotoInput" name="photo" class="form-control" accept="image/*">
              <div class="form-text">PNG, JPG or WebP.</div>
            </div>

            <div class="d-flex justify-content-end gap-2">
              <a href="{{ url_for('admin_bp.product_page') }}" class="btn btn-outline-secondary px-4">Cancel</a>
              <button type="submit" class="btn btn-farm px-4">Save Product</button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <!-- Live Preview Column -->
    <div class="col-lg-4">
      <div class="panel sticky-top" style="top: 20px;">
        <div class="panel-header"><h2>Live Preview</h2></div>
        <div class="panel-body p-4 text-center">
          <div class="d-flex align-items-center justify-content-center mb-3" style="min-height: 220px; background: #f6f4ef; border: 1px dashed #e4e0d6; border-radius: 12px; padding: 8px;">
            <img id="previewImg" src="/static/images/bread.jpg" alt="Preview" style="max-width: 100%; height: auto; max-height: 360px; object-fit: contain; border-radius: 8px;" class="d-none">
            <i id="previewIcon" class="bi bi-image text-muted" style="font-size:2.5rem;"></i>
          </div>
          <h5 id="previewTitle" class="fw-semibold mb-1">Product Name</h5>
          <div id="previewMeta" class="text-muted small mb-2">Category · Farm Name</div>
          <div class="fw-bold fs-5" style="color:#1e3323;">
            $<span id="previewPrice">0.00</span>
            <span id="previewUnit" class="text-muted fw-normal small">/ unit</span>
          </div>
          <span id="previewStatusBadge" class="pill pill-approved mt-2 d-inline-block">Approved</span>
        </div>
      </div>
    </div>
  </div>
</main>
{% endblock %}

{% block scripts %}
<script>
  const nameInput = document.getElementById('prodNameInput');
  const catInput = document.getElementById('prodCatInput');
  const farmInput = document.getElementById('prodFarmInput');
  const priceInput = document.getElementById('prodPriceInput');
  const unitInput = document.getElementById('prodUnitInput');
  const statusInput = document.getElementById('prodStatusInput');
  const photoInput = document.getElementById('prodPhotoInput');

  const previewTitle = document.getElementById('previewTitle');
  const previewMeta = document.getElementById('previewMeta');
  const previewPrice = document.getElementById('previewPrice');
  const previewUnit = document.getElementById('previewUnit');
  const previewStatus = document.getElementById('previewStatusBadge');
  const previewImg = document.getElementById('previewImg');
  const previewIcon = document.getElementById('previewIcon');

  function updatePreview() {
    if (previewTitle) previewTitle.textContent = nameInput.value || 'Product Name';
    const cat = catInput.value || 'Category';
    const farm = farmInput.value || 'Farm';
    if (previewMeta) previewMeta.textContent = `${cat} · ${farm}`;
    if (previewPrice) previewPrice.textContent = priceInput.value ? parseFloat(priceInput.value).toFixed(2) : '0.00';
    if (previewUnit) previewUnit.textContent = unitInput.value ? `/ ${unitInput.value}` : '/ unit';

    if (previewStatus) {
      previewStatus.textContent = statusInput.value;
      previewStatus.className = `pill pill-${statusInput.value.toLowerCase()} mt-2 d-inline-block`;
    }
  }

  [nameInput, catInput, farmInput, priceInput, unitInput, statusInput].forEach(el => {
    if (el) el.addEventListener('input', updatePreview);
  });

  if (photoInput) {
    photoInput.addEventListener('change', () => {
      const file = photoInput.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = (e) => {
          previewImg.src = e.target.result;
          previewImg.classList.remove('d-none');
          previewIcon.classList.add('d-none');
        };
        reader.readAsDataURL(file);
      }
    });
  }
</script>
{% endblock %}
