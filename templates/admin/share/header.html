    <header class="topbar">
      <div class="d-flex align-items-center gap-2">
          <form class="search-box" role="search">
          <i class="bi bi-search"></i>
          <input type="search" class="form-control form-control-sm" placeholder="Search farmers, products, orders…">
        </form>
      </div>

      <div class="d-flex align-items-center gap-2">
        <div class="dropdown">
          <a class="admin-chip dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown">
            <div class="admin-avatar">
              {% if session.get('profile') %}
                <img src="{{ url_for('static', filename='uploads/thumb/' + session.get('profile')) }}" alt="{{ session.get('farmer_name', 'Admin') }}" onerror="this.onerror=null;this.src='{{ url_for('static', filename='images/bean.jpg') }}';">
              {% else %}
                <img src="{{ url_for('static', filename='images/bean.jpg') }}" alt="{{ session.get('farmer_name', 'Admin') }}">
              {% endif %}
            </div>
            <span class="d-none d-sm-inline fw-semibold" style="font-size:0.88rem;">{{ session.get('farmer_name') }}</span>
          </a>
          <ul class="dropdown-menu dropdown-menu-end">
            <li><a class="dropdown-item" href="{{ url_for('admin_bp.setting_page') }}"><i class="bi bi-gear me-2"></i>Settings</a></li>
            <li><hr class="dropdown-divider"></li>
            <li><a class="dropdown-item text-danger" href="{{ url_for('admin_bp.admin_logout') }}"><i class="bi bi-box-arrow-right me-2"></i>Logout</a></li>
          </ul>
        </div>
      </div>
    </header>
    <div class="soil-line"></div>
