<div class="hero-bar">
      <div>
        <div class="breadcrumb-trail">Admin / {{ module }}</div>
        <h1>Welcome back, Admin</h1>
      </div>
    <div class="hero-actions d-flex gap-2">
        {% if module in ['user_farmer'] %}
        <a href="{{ url_for('admin_bp.add_user_farmer') }}" class="btn btn-amber btn-sm"><i class="bi bi-plus-lg me-1"></i>Add Farmer</a>
        {% endif %}
        {% if module in ['user_customer'] %}
        <a href="{{ url_for('admin_bp.add_user_customer') }}" class="btn btn-amber btn-sm"><i class="bi bi-plus-lg me-1"></i>Add Customer</a>
        {% endif %}
        {% if module == 'category' %}
        <a href="{{ url_for('admin_bp.add_product') }}" class="btn btn-amber btn-sm"><i class="bi bi-plus-lg me-1"></i>Add Category</a>
        {% endif %}
        {% if module == 'product' %}
        <a href="{{ url_for('admin_bp.add_product') }}" class="btn btn-amber btn-sm"><i class="bi bi-plus-lg me-1"></i>Add Product</a>
        {% endif %}
      </div>
    </div>
