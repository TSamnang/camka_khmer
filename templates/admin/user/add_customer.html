<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Add Customer · FarmMarket Admin</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <link rel="stylesheet" href="/static/admin/style/style.css">
</head>

<body>

  <div class="app-shell d-flex">

    <!-- Off-canvas toggle: pure CSS, no JavaScript -->
    <input type="checkbox" id="sidebar-toggle" class="sidebar-toggle-input">
    <label for="sidebar-toggle" class="sidebar-overlay" aria-hidden="true"></label>

    <!-- ============================= SIDEBAR ============================= -->
    {% include "admin/share/sidebar.html" %}

    <!-- ============================ MAIN COLUMN ============================ -->
    <div class="main-col">

      <!-- Header / top bar -->
      {% include "admin/share/header.html" %}

      <!-- Hero-bar / page title strip -->
      <div class="hero-bar">
        <div>
          <div class="breadcrumb-trail">Admin / {{ module }}</div>
          <h1>Add a new customer</h1>
        </div>
        <div class="hero-actions d-flex gap-2">
          <a href="{{ url_for('admin_bp.user_customer_page') }}" class="btn btn-outline-light btn-sm"><i
              class="bi bi-arrow-left me-1"></i>Back to Customer</a>
        </div>
      </div>

      <!-- Page content -->
      <main class="content-area">
        <div class="row g-3">

          <div class="col-lg-8">
            <div class="panel">
              <div class="panel-header">
                <h2>Customer details</h2>
              </div>
              <div class="panel-body p-4">
                <form
                  method="post"
                  action="{{ url_for('admin_bp.do_add_user_customer') }}"
                  enctype="multipart/form-data"
                >
                 <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                  <!-- ── Profile Photo Upload ── -->
                  <div class="mb-4 d-flex flex-column align-items-center">
                    <label class="form-label fw-semibold mb-2 w-100">Profile photo</label>
                    <div class="profile-upload-wrap" id="profileUploadWrap" title="Click to choose a photo">
                      <img id="profilePreview" src="" alt="Profile preview" class="profile-preview-img d-none">
                      <div id="profilePlaceholder" class="profile-placeholder">
                        <i class="bi bi-camera-fill"></i>
                        <span>Browse</span>
                      </div>
                    </div>
                    <input type="file" id="profilePhotoInput" name="image" accept="image/*" class="d-none">
                    <p class="text-muted small mt-2 mb-0">Click the circle to upload a profile picture</p>
                  </div>

                  <div class="mb-3">
                    <label class="form-label fw-semibold">Customer name</label>
                    <input type="text" name="customer_name" class="form-control" placeholder="e.g. Sok Dara"
                      required>
                  </div>

                  <div class="row">
                    <div class="col-md-6 mb-3">
                      <label class="form-label fw-semibold">Email</label>
                      <input type="email" name="customer_email" class="form-control" placeholder="sokdara@example.com"
                        required>
                    </div>
                    <div class="col-md-6 mb-3">
                      <label class="form-label fw-semibold">Phone</label>
                      <input type="text" name="phoneNumber" class="form-control" placeholder="012 345 678" required>
                    </div>
                  </div>

                  <div class="mb-3">
                    <label class="form-label fw-semibold">Location / Province</label>
                    <input type="text" name="location" class="form-control" placeholder="e.g. Phnom Penh" required>
                  </div>

                  <div class="row">
                    <div class="col-md-6 mb-3">
                      <label class="form-label fw-semibold">Role</label>
                      <select name="role" class="form-select">
                        <option value="user" selected>Customer</option>
                      </select>
                    </div>
                    <div class="col-md-6 mb-3">
                      <label class="form-label fw-semibold">Status</label>
                      <select name="status" class="form-select">
                        <option value="Active" selected>Active</option>
                        <option value="Inactive">Inactive</option>
                        <option value="Pending">Pending</option>
                      </select>
                    </div>
                  </div>

                  <div class="mb-3">
                    <label class="form-label fw-semibold">Password</label>
                    <input type="password" name="password" class="form-control" placeholder="Enter password" required>
                  </div>

                  <div class="d-flex justify-content-end gap-2">
                    <a href="{{ url_for('admin_bp.user_customer_page') }}" class="btn btn-outline-secondary px-4">Cancel</a>
                    <button type="submit" class="btn btn-farm px-4">Save customer</button>
                  </div>
                </form>
              </div>
            </div>
          </div>

        </div>
      </main>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/static/admin/js/add_farmer.js"></script>
</body>

</html>
