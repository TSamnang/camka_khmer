<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard · FarmMarket Admin</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <link rel="stylesheet" href="/static/admin/style/style.css">
</head>
<body>

<div class="app-shell d-flex">

  <input type="checkbox" id="sidebar-toggle" class="sidebar-toggle-input">
  <label for="sidebar-toggle" class="sidebar-overlay" aria-hidden="true"></label>

  <!-- ============================= SIDEBAR ============================= -->
    {% include 'admin/share/sidebar.html' %}

  <!-- ============================ MAIN COLUMN ============================ -->
  <div class="main-col">

    <!-- Header / top bar -->
    {% include 'admin/share/header.html' %}

    <!-- Hero-bar / page title strip -->
    {% include 'admin/share/hero.html' %}

    <!-- Page content -->
      {% block content %}

      {% endblock %}
      
      
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
{% block scripts %}{% endblock %}
</body>
</html>
