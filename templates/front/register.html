<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register — ចម្ការខ្មែរ</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <link
    href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=DM+Sans:wght@300;400;500&display=swap"
    rel="stylesheet" />
  <link href="/static/style/register.css" rel="stylesheet" />
</head>

<body>

  <div class="auth-wrapper">
    <div class="auth-card fade-up visible">
      <div class="auth-img">
        <div class="auth-img-content">
          <a href="{{ url_for('front_bp.homepage') }}" class="text-decoration-none">
            <h2 class="mb-3" style="font-family: 'Playfair Display', serif; color: #fff;">ចម្ការ<span
                style="color: var(--gold, #e0a96d);">ខ្មែរ</span></h2>
          </a>
          <p style="color: rgba(255,255,255,0.8); font-weight: 300;">Join thousands of buyers supporting local farmers
            across Cambodia.</p>
        </div>
      </div>
      <div class="auth-form-wrap">
        <h3 style="font-family: 'Playfair Display', serif; color: var(--text-dark); margin-bottom: 0.5rem;">Create Account</h3>
        <p class="text-muted mb-3" style="font-size: 0.9rem;">Already have an account? <a href="{{ url_for('front_bp.login', next=next_url) }}"
            style="color: var(--green-bright); font-weight: 500; text-decoration: none;">Sign in</a></p>

        {% if error %}
        <div class="alert alert-danger py-2 mb-3 small d-flex align-items-center gap-2" role="alert">
          <i class="bi bi-exclamation-triangle-fill fs-5 text-danger"></i>
          <div>{{ error }}</div>
        </div>
        {% endif %}

        <form action="{{ url_for('front_bp.register_post') }}" method="POST">
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
          {% if next_url %}
          <input type="hidden" name="next" value="{{ next_url }}">
          {% endif %}

          <div class="row g-3">
            <div class="col-6">
              <label class="form-label text-muted" style="font-size: 0.85rem;">First Name</label>
              <input type="text" name="firstname" class="form-control" placeholder="e.g. John" required autofocus>
            </div>
            <div class="col-6">
              <label class="form-label text-muted" style="font-size: 0.85rem;">Last Name</label>
              <input type="text" name="lastname" class="form-control" placeholder="e.g. Doe">
            </div>
            <div class="col-12">
              <label class="form-label text-muted" style="font-size: 0.85rem;">Email Address</label>
              <input type="email" name="email" class="form-control" placeholder="you@example.com" required>
            </div>
            <div class="col-12">
              <label class="form-label text-muted" style="font-size: 0.85rem;">Phone Number</label>
              <input type="tel" name="phone" class="form-control" placeholder="012 345 678" required>
            </div>
            <div class="col-12">
              <label class="form-label text-muted" style="font-size: 0.85rem;">Delivery Location / City</label>
              <input type="text" name="address" class="form-control" placeholder="e.g. Phnom Penh, Toul Kork">
            </div>
            <div class="col-12">
              <label class="form-label text-muted" style="font-size: 0.85rem;">Password</label>
              <input type="password" name="password" class="form-control" placeholder="Create a strong password" required>
            </div>
            <div class="col-12">
              <div class="form-check mt-1">
                <input class="form-check-input" type="checkbox" id="terms" required checked>
                <label class="form-check-label text-muted" for="terms" style="font-size: 0.8rem;">
                  I agree to the Terms of Service & Privacy Policy.
                </label>
              </div>
            </div>
            <div class="col-12">
              <button type="submit" class="btn-submit">Create Account & Continue</button>
            </div>
          </div>
        </form>

        <div class="divider">OR</div>

        <a href="{{ url_for('front_bp.homepage') }}" class="btn btn-outline-secondary w-100 py-2 small" style="border-radius: 50px;">
          ← Return to Store
        </a>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
