<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register — ចម្ការខ្មែរ</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link
    href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=DM+Sans:wght@300;400;500&display=swap"
    rel="stylesheet" />
  <link href="/static/style/register.css" rel="stylesheet" />

</head>

<body>

  <div class="auth-wrapper">
    <div class="auth-card fade-up visible">
      <div class="auth-img">
        <div class="auth-img-content">
          <a href="{{ url_for('front_bp.homepage') }}" class="text-decoration-none">
            <h2 class="mb-3" style="font-family: 'Playfair Display', serif; color: #fff;">Khmer<span
                style="color: var(--gold);">Harvest</span></h2>
          </a>
          <p style="color: rgba(255,255,255,0.8); font-weight: 300;">Join thousands of buyers supporting local farmers
            across Cambodia.</p>
        </div>
      </div>
      <div class="auth-form-wrap">
        <h3 style="font-family: 'Playfair Display', serif; color: var(--text-dark); margin-bottom: 0.5rem;">Create an
          Account</h3>
        <p class="text-muted mb-4" style="font-size: 0.9rem;">Already have an account? <a href="{{ url_for('front_bp.login') }}"
            style="color: var(--green-bright); font-weight: 500; text-decoration: none;">Log in</a></p>

        <form>
          <div class="row g-3">
            <div class="col-6">
              <label class="form-label text-muted" style="font-size: 0.85rem;">First Name</label>
              <input type="text" class="form-control" placeholder="John" required>
            </div>
            <div class="col-6">
              <label class="form-label text-muted" style="font-size: 0.85rem;">Last Name</label>
              <input type="text" class="form-control" placeholder="Doe" required>
            </div>
            <div class="col-12">
              <label class="form-label text-muted" style="font-size: 0.85rem;">Email Address</label>
              <input type="email" class="form-control" placeholder="you@example.com" required>
            </div>
            <div class="col-12">
              <label class="form-label text-muted" style="font-size: 0.85rem;">Password</label>
              <input type="password" class="form-control" placeholder="Create a strong password" required>
            </div>
            <div class="col-12">
              <div class="form-check mt-2">
                <input class="form-check-input" type="checkbox" id="terms" required>
                <label class="form-check-label text-muted" for="terms" style="font-size: 0.8rem;">
                  I agree to the <a href="#" style="color: var(--green-bright);">Terms of Service</a> and <a href="#"
                    style="color: var(--green-bright);">Privacy Policy</a>.
                </label>
              </div>
            </div>
            <div class="col-12">
              <button type="submit" class="btn-submit">Sign Up</button>
            </div>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
