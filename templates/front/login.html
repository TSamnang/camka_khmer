<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — ចម្ការខ្មែរ</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link
    href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=DM+Sans:wght@300;400;500&display=swap"
    rel="stylesheet" />
  <link href="/static/style/login.css" rel="stylesheet" />
</head>

<body>

  <div class="auth-wrapper">
    <div class="auth-card fade-up visible">
      <div class="auth-img">
        <div class="auth-img-content">
          <a href="{{ url_for('front_bp.homepage') }}" class="text-decoration-none">
            <h2 class="mb-3" style="font-family: 'Playfair Display', serif; color: #fff;">Khmer<span
                style="color: var(--gold);">Harvest</span></h2>
          </a>
          <p style="color: rgba(255,255,255,0.8); font-weight: 300;">Welcome back to the best source for fresh Cambodian
            produce.</p>
        </div>
      </div>
      <div class="auth-form-wrap">
        <h3 style="font-family: 'Playfair Display', serif; color: var(--text-dark); margin-bottom: 0.5rem;">Log In</h3>
        <p class="text-muted mb-4" style="font-size: 0.9rem;">Don't have an account? <a href="{{ url_for('front_bp.register') }}"
            style="color: var(--green-bright); font-weight: 500; text-decoration: none;">Sign up</a></p>

        <form action="{{ url_for('front_bp.login_post') }}" method="POST">
          <div class="mb-3">
            <label class="form-label text-muted" style="font-size: 0.85rem;">Email Address</label>
            <input type="email" class="form-control" placeholder="you@example.com" required>
          </div>
          <div class="mb-3">
            <div class="d-flex justify-content-between align-items-center">
              <label class="form-label text-muted mb-0" style="font-size: 0.85rem;">Password</label>
              <a href="#" style="font-size: 0.8rem; color: var(--text-light); text-decoration: none;">Forgot
                Password?</a>
            </div>
            <input type="password" class="form-control mt-2" placeholder="••••••••" required>
          </div>
          <button type="submit" class="btn-submit">Sign In</button>
        </form>

        <div class="divider">OR</div>

        <button class="btn-social">
          <img src="https://upload.wikimedia.org/wikipedia/commons/c/c1/Google_%22G%22_logo.svg" alt="Google"
            width="20">
          Continue with Google
        </button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
